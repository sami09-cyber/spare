<div class="flex min-h-screen">
  <!-- Left Column -->
  <div class="flex-1 flex flex-col p-8 lg:p-12 xl:p-16">
    <div class="flex items-center gap-2 mb-12">
      <span class="text-5xl font-bold text-blue-600">Spare</span>
    </div>

    <div class="max-w-md w-full mx-auto">
      <div class="mb-4">
        <h1 class="text-4xl font-bold mb-2">Welcome Back!</h1>
        <p class="text-gray-500">Please enter login details below</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-2">
          <label for="lastName" class="sr-only">Email address</label>
          <input id="lastName" type="email" [(ngModel)]="formData.lastName" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-200" placeholder="Last Name" />
        </div>

        <div class="space-y-2">
          <label for="firstName" class="sr-only">Email address</label>
          <input id="firstName" type="email" [(ngModel)]="formData.firstName" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-200" placeholder="First Name" />
        </div>

        <div class="space-y-2">
          <label for="email" class="sr-only">Email address</label>
          <input id="email" type="email" [(ngModel)]="formData.email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-200" placeholder="Email address" />
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium">Password</label>
          <input id="password" type="password" [(ngModel)]="formData.password" name="password" required class="w-full px-4 py-3 rounded-lg border border-gray-200" placeholder="Password" />
        </div>


        <button type="submit" class="w-full bg-[#4339F2] hover:bg-[#4339F2]/90 text-white py-3 rounded-lg">Sign in </button>

        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 text-gray-500 bg-white">Or continue</span>
          </div>
        </div>

        <button (click)="onLoginWithGoogle()" class="w-full flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-3 hover:bg-gray-50">
          <img src="https://www.google.com/favicon.ico" alt="Google" class="w-5 h-5" />
          <span>Log in with Google</span>
        </button>

        <button (click)="onLoginWithFacebook()" class="w-full flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-3 hover:bg-gray-50">
          <img src="https://www.facebook.com/favicon.ico" alt="Facebook" class="w-5 h-5" />
          <span>Log in with Facebook</span>
        </button>

        <p class="text-center text-gray-500 mt-8"> Do have an account? <a href="/login" class="text-[#4339F2] hover:underline">Sign In</a></p>
      </form>
    </div>
  </div>

  <!-- Right Column -->
  <div class="hidden lg:flex lg:flex-1 bg-[#8B85FF]/20">
    <div class="relative w-full h-full flex flex-col items-center justify-center p-12">
      <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-rjiBYFSPXXttQtLWH3pIXKWS5JH5Fd.png" alt="Task Management Illustration" class="w-full max-w-2xl"  priority />
      <div class="absolute bottom-12 text-center">
        <p class="text-xl text-gray-600 italic mb-4"> Manage your task in an easy and more efficient way with Tasky... </p>
        <div class="flex gap-2 justify-center">
          <div class="w-2 h-2 rounded-full bg-white"></div>
          <div class="w-2 h-2 rounded-full bg-gray-300"></div>
          <div class="w-2 h-2 rounded-full bg-gray-300"></div>
        </div>
      </div>
    </div>
  </div>
</div>
