<div class="max-w-7xl mx-auto py-16 px-4 sm:px-6 lg:py-24 lg:px-8">
  <div class="grid grid-cols-1 gap-12 lg:grid-cols-3">
    <div *ngFor="let feature of features" class="bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="p-6">
        <div class="flex items-center">
          <div class="flex-shrink-0">
            <i [ngClass]="feature.icon" class="text-3xl text-blue-500"></i>
          </div>
          <div class="ml-4">
            <h3 class="text-lg font-medium text-gray-900">{{ feature.title }}</h3>
          </div>
        </div>
        <div class="mt-4">
          <p class="text-base text-gray-500">{{ feature.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
