<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-6">Connectez votre compte bancaire</h1>

  <div class="mb-6">
    <label for="country" class="block text-sm font-medium text-gray-700 mb-1">Pays</label>
    <select
      id="country"
      [(ngModel)]="country"
      (change)="onCountryChange()"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
    >
      <option value="FR">France</option>
      <option value="DE">Allemagne</option>
      <option value="ES">Espagne</option>
      <option value="IT">Italie</option>
      <option value="BE">Belgique</option>
      <option value="NL">Pays-Bas</option>
    </select>
  </div>

  <div *ngIf="loading" class="flex justify-center my-8">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>

  <div *ngIf="!loading && institutions.length > 0" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div
      *ngFor="let institution of institutions"
      (click)="selectInstitution(institution)"
      class="border rounded-lg p-4 flex flex-col items-center cursor-pointer transition-all hover:shadow-md"
      [class.border-indigo-500]="selectedInstitution?.id === institution.id"
      [class.bg-indigo-50]="selectedInstitution?.id === institution.id"
    >
      <div class="h-12 w-12 mb-2 flex items-center justify-center">
        <img
          *ngIf="institution.logo"
          [src]="institution.logo"
          [alt]="institution.name"
          class="max-h-full max-w-full object-contain"
        />
        <div *ngIf="!institution.logo" class="h-12 w-12 bg-gray-200 rounded-full flex items-center justify-center">
          <span class="text-gray-500 text-xs">{{ institution.name.substring(0, 2) }}</span>
        </div>
      </div>
      <span class="text-sm text-center">{{ institution.name }}</span>
    </div>
  </div>

  <div *ngIf="!loading && institutions.length === 0" class="text-center py-8 text-gray-500">
    Aucune banque disponible pour ce pays
  </div>

  <div class="mt-8 flex justify-center">
    <button
      (click)="connectToBank()"
      [disabled]="!selectedInstitution || loading"
      class="px-6 py-3 bg-indigo-600 text-white rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Connecter ma banque
    </button>
  </div>
</div>
