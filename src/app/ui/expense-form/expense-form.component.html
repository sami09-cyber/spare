<div class="bg-white p-6 rounded-lg shadow-sm">
  <h2 class="text-lg font-semibold mb-4">Add Future Expense</h2>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Description</label>
      <input
        type="text"
        name="description"
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <div>
      <label class="block text-sm mb-1">Amount</label>
      <input
        type="number"
        name="amount"
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <div>
      <label class="block text-sm mb-1">Category</label>
      <select name="category" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="" disabled selected>Select a category</option>
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
    </div>

    <button
      type="submit"
      class="w-full bg-black text-white p-2 rounded hover:bg-gray-800"
    >
      Add Expense
    </button>
  </form>
</div>
